name: Japean flux Google Shopping quotidien

on:
  schedule:
    # 02h15 UTC = 04h15 a Paris en ete. Merchant Center est regle pour recuperer le CSV
    # chaque jour a 05h00 Paris : le fichier lu a moins d'une heure.
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: japean-google
  cancel-in-progress: false

jobs:
  google:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerer le flux Google Shopping et notifier Discord
        env:
          JAPEAN_GOOGLE_URL: ${{ secrets.JAPEAN_GOOGLE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node google.mjs
