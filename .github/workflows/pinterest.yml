name: Japean flux Pinterest quotidien

on:
  schedule:
    # 21h30 UTC = 23h30 a Paris en ete. Pinterest ingere le flux chaque nuit vers 22h43 UTC
    # (00h43 Paris) : on regenere ~1h avant pour qu'il lise toujours un fichier du jour.
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: japean-pinterest
  cancel-in-progress: false

jobs:
  pinterest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerer le flux catalogue et notifier Discord
        env:
          JAPEAN_PINTEREST_URL: ${{ secrets.JAPEAN_PINTEREST_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node pinterest.mjs
